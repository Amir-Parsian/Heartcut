# Published per-token prices, USD per one million tokens.
#
# The benchmark multiplies logged token usage by these prices and records the date
# below in every results file. Check the provider's pricing page and update the date
# before publishing results. A teacher config can override an entry with `pricing:`.
#
# cache_read / cache_write: prompt-cache rates (Anthropic: reads ~0.1x and 5-minute
# writes 1.25x the base input price; Claude Opus 5.5 reads are $0.20).
as_of: "2026-10-06"
source: "https://platform.claude.com/docs/en/about-claude/pricing"
models:
  claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  # Haiku 5.5 rates apply to prompts up to 100K tokens (classification prompts are far below).
  claude-haiku-5-5:  {input: 0.10, output: 0.50, cache_read: 0.01, cache_write: 0.125}
  claude-haiku-4-5:  {input: 1.00, output: 5.00, cache_read: 0.10, cache_write: 1.25}
