[project]
name = "heartcut"
version = "0.1.0"
description = "Distill an expensive LLM classifier into a tiny model: label with a teacher LLM, train compact students, benchmark cost/accuracy/latency, serve on CPU."
# The PyPI description is README.md rewritten for PyPI; see fancy-pypi-readme below.
dynamic = ["readme"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amir Parsian" }]
requires-python = ">=3.11"
keywords = ["distillation", "llm", "text-classification", "onnx", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core install is deliberately small: it is what the serving image needs
# besides the [serve] extra. Everything heavy lives in an extra.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Data loading, classical students, metrics and charts.
pipeline = [
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
]
# Hosted and local (OpenAI-compatible) teacher backends.
teachers = [
    "anthropic>=1.0",
    "openai>=1.40",
]
# Neural students. Train on a GPU or free Colab; inference runs on CPU via ONNX.
students = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "transformers>=4.44",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxscript>=0.1",
    "skl2onnx>=1.17",
]
serve = [
    "fastapi>=0.111",
    "onnxruntime>=1.19",
    "tokenizers>=0.19",
    "uvicorn>=0.30",
]
tracking = ["mlflow>=2.14"]
demo = ["gradio>=4.40"]
all = ["heartcut[pipeline,teachers,students,export,serve,tracking,demo]"]

[project.urls]
Homepage = "https://github.com/Amir-Parsian/Heartcut"
Issues = "https://github.com/Amir-Parsian/Heartcut/issues"

[project.scripts]
heartcut = "heartcut.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heartcut"]

[tool.hatch.build.targets.wheel.force-include]
# Installed users have no configs/ directory; config.py falls back to this copy.
"configs/pricing.yaml" = "heartcut/pricing.yaml"

# PyPI does not resolve relative links or render Mermaid, so the PyPI description points
# relative links at the release's tag on GitHub (raw files for images, including the
# charts that `heartcut report` writes into the README) and swaps the diagram for a link.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid\n.*?```\n'
replacement = '*The pipeline diagram is in the [README on GitHub](https://github.com/Amir-Parsian/Heartcut/tree/v$HFPR_VERSION#how-it-works).*\n'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(!\[[^\]]*\]\()(?!https?://)([^)\s]+)\)'
replacement = '\1https://raw.githubusercontent.com/Amir-Parsian/Heartcut/v$HFPR_VERSION/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\b(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/Amir-Parsian/Heartcut/v$HFPR_VERSION/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/Amir-Parsian/Heartcut/tree/v$HFPR_VERSION/\1)'

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "NPY",      # numpy
    "PD",       # pandas
]
ignore = [
    "RUF001",   # ambiguous unicode in strings (used in docs/prompts)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/heartcut"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = [
    "datasets.*",
    "sklearn.*",
    "skl2onnx.*",
    "onnx.*",
    "onnxruntime.*",
    "sentence_transformers.*",
    "transformers.*",
    "mlflow.*",
    "gradio.*",
    "matplotlib.*",
    "joblib.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyTorch training/export code calls into partially annotated torch/transformers APIs.
module = ["heartcut.students.encoder", "heartcut.students.setfit", "heartcut.serve.export"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: trains a (tiny) neural model; deselect with -m 'not slow'",
    "integration: runs the whole pipeline end to end",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning:transformers.*",
]

[tool.coverage.run]
source = ["heartcut"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]
