[project]
name = "distillkit"
version = "0.1.0"
description = "Distill an expensive LLM classifier into a tiny model: label with a teacher LLM, train compact students, benchmark cost/accuracy/latency, serve on CPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amir Parsian" }]
requires-python = ">=3.11"
keywords = ["distillation", "llm", "text-classification", "onnx", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core install is deliberately small: it is what the serving image needs
# besides the [serve] extra. Everything heavy lives in an extra.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Data loading, classical students, metrics and charts.
pipeline = [
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scikit-learn>=1.5",
]
# Hosted and local (OpenAI-compatible) teacher backends.
teachers = [
    "anthropic>=1.0",
    "openai>=1.40",
]
# Neural students. Train on a GPU or free Colab; inference runs on CPU via ONNX.
students = [
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "transformers>=4.44",
]
export = [
    "onnx>=1.16",
    "onnxruntime>=1.19",
    "onnxscript>=0.1",
    "skl2onnx>=1.17",
]
serve = [
    "fastapi>=0.111",
    "onnxruntime>=1.19",
    "tokenizers>=0.19",
    "uvicorn>=0.30",
]
tracking = ["mlflow>=2.14"]
demo = ["gradio>=4.40"]
all = ["distillkit[pipeline,teachers,students,export,serve,tracking,demo]"]

[project.urls]
Homepage = "https://github.com/Amir-Parsian/DistillKit"
Issues = "https://github.com/Amir-Parsian/DistillKit/issues"

[project.scripts]
distillkit = "distillkit.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pre-commit>=3.7",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillkit"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # prefer pathlib
    "NPY",      # numpy
    "PD",       # pandas
]
ignore = [
    "RUF001",   # ambiguous unicode in strings (used in docs/prompts)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src/distillkit"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = [
    "datasets.*",
    "sklearn.*",
    "skl2onnx.*",
    "onnx.*",
    "onnxruntime.*",
    "sentence_transformers.*",
    "transformers.*",
    "mlflow.*",
    "gradio.*",
    "matplotlib.*",
    "joblib.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: trains a (tiny) neural model; deselect with -m 'not slow'",
    "integration: runs the whole pipeline end to end",
]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::FutureWarning:transformers.*",
]

[tool.coverage.run]
source = ["distillkit"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "if __name__ == .__main__.:",
]
