# Run from the repository root:
#   uv run heartcut data  -c examples/helpdesk/experiment.yaml
#   uv run heartcut label -c examples/helpdesk/experiment.yaml --dry-run
#   uv run heartcut run   -c examples/helpdesk/experiment.yaml \
#       --set teacher=configs/teachers/simulated.yaml          # free, for a dry run
name: helpdesk
dataset: dataset.yaml
teacher: ../../configs/teachers/claude-haiku-5-5.yaml
students:
  - ../../configs/students/tfidf-logreg.yaml
  - ../../configs/students/setfit-minilm.yaml
seeds: [0, 1, 2]
budgets: [full]
tracking:
  backend: none
